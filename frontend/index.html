<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PlaceMentor AI — Placement Preparation OS</title>

  <meta
    name="description"
    content="PlaceMentor AI — AI-Powered Placement Preparation Operating System"
  />

  <meta
    name="author"
    content="PlaceMentor AI Team"
  />

  <meta property="og:title" content="PlaceMentor AI" />

    property="og:description"
    content="From Student to Tier-1 Offer Letter"
  />
  <meta property="og:type" content="website" />

  <!-- Google Fonts Preconnect and Professional Monospace Programming Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Pre-paint Theme Script to prevent flash of unstyled theme -->
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('pm_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = savedTheme ? savedTheme : (prefersDark ? 'dark' : 'dark');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
